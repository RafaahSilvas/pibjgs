email:
  subject: "Default Subject"
  message: "Default Message"
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pibjs?useTimezone=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        SMTP:
          auth: true
          STARTTLS:
            enable: true
          required: true

server:
  port: 8080

joinfaces:
  faces:
    project-stage: Development